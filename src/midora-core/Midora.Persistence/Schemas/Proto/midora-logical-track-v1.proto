edition = "2024";

package midora.persistence.v1;

import "Schemas/Proto/midora-common-v1.proto";
import "Schemas/Proto/midora-event-instrument-v1.proto";

option csharp_namespace = "Midora.Persistence.Wire.Proto.V1";
option features.field_presence = EXPLICIT;

message LogicalNoteV1 {
  int64 id = 1;
  int64 start_tick = 2;
  int64 length_ticks = 3;
  int32 note = 4;
  int32 velocity = 5;
  reserved 6 to max;
}

message LogicalParameterLaneV1 {
  int64 id = 1;
  int64 parameter_id = 2;
  repeated CurvePointV1 points = 3;
  reserved 4 to max;
}

message SegmentV1 {
  int64 id = 1;
  int64 project_start_tick = 2;
  int64 length_ticks = 3;
  int64 content_offset_tick = 4;
  repeated LogicalNoteV1 notes = 5;
  repeated LogicalParameterLaneV1 parameter_lanes = 6;
  reserved 7 to max;
}

message LogicalTrackV1 {
  uint32 schema_version = 1;
  string object_type = 2;
  int64 id = 3;
  string name = 4;
  int64 event_instrument_id = 5;
  reserved 6;
  RgbColor color_override = 7;
  repeated SegmentV1 segments = 8;
  reserved 9 to max;
}
